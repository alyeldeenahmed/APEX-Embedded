name: Firmware and protocol checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host software validation
        run: python tools/validate_software.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-software-validation
          path: build/software-validation.json
          if-no-files-found: error
          retention-days: 14

  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.0 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile N16R8 UART telemetry prototype
        run: python tools/build_firmware.py
      - name: Compile MPU-6050 acquisition mode
        run: python tools/build_firmware.py --imu
      - name: Compile standalone IMU bench mode
        run: python tools/build_firmware.py --bench
      - name: Compile integrated vehicle firmware
        run: python tools/build_firmware.py --vehicle
      - name: Compile proposed wheel diagnostics (outputs disabled)
        run: python tools/build_firmware.py --vehicle --wheel-diagnostics-v2
      - name: Compile planned 200 Hz IMU telemetry profile
        run: python tools/build_firmware.py --vehicle --telemetry-hz 200
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-n16r8-vehicle-200hz
          path: build/vehicle-200hz/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-n16r8-vehicle
          path: build/vehicle/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-n16r8-imu-bench
          path: build/imu-bench/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-n16r8-vehicle-wheel-v2-proposal
          path: build/vehicle-wheel-v2/
          retention-days: 14
