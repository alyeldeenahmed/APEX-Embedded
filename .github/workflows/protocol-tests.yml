name: Firmware and protocol checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Compile host encoder and compare with Python
        run: python tools/check_cpp_packets.py
      - name: Compile and run MPU-6050 logic tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I. tests/test_mpu6050.cpp -o /tmp/test_mpu6050
          /tmp/test_mpu6050

  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.0 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile N8R2 UART telemetry prototype
        run: python tools/build_firmware.py
      - name: Compile MPU-6050 acquisition mode
        run: python tools/build_firmware.py --imu
